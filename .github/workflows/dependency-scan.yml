name: Dependency scan

# Checks the Python dependencies locked in uv.lock for known vulnerabilities, on every pull
# request and in the merge queue. An organization ruleset requires it ("Require workflows to
# pass before merging"), so it runs in the repository of the pull request, with that
# repository's files and token: see README.md.
#
# A ruleset ignores the filters of the triggers (branches, paths, types), so the job checks
# by itself whether there is anything to scan. The scan is scripts/dependency_scan.py of this
# repository, taken from the same commit as this file.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  scan:
    name: Dependency scan
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      # the repository of the pull request, which the scan reads
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The script of the scan. With a ruleset, this workflow runs in another repository:
      # `job.workflow_repository` and `job.workflow_sha` name this repository and the commit
      # of this file, which the ruleset pins, so the script can't differ from the reviewed one.
      # It goes next to the files of the pull request, untracked, so the scan doesn't see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .dependency-scan
          sparse-checkout: scripts
          persist-credentials: false

      # No cache: the job must not restore files that another run could have written.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # `uv audit` is a preview feature: its output can change between releases, so
          # the version is pinned and moved on purpose.
          version: "0.13.8"
          enable-cache: false

      - name: Scan uv.lock for known vulnerabilities
        env:
          # reads the public advisory database: the token only raises the rate limit
          GITHUB_TOKEN: ${{ github.token }}
          EXCEPTIONS_FILE: .github/vulnerability-exceptions.toml
        # --no-config: the uv settings of the repository (uv.toml, [tool.uv]) apply to `uv
        # audit`, which the script runs next to each uv.lock, but not to running the script
        run: uv run --no-config --no-project .dependency-scan/scripts/dependency_scan.py
